on:
  push:
    branches: [windows, 'windows-*']
  workflow_dispatch: {}

name: Windows (fork)

# The Test workflow's jobs run on Namespace runners, which only
# ghostty-org/ghostty has, so forks working on the Windows port get no CI
# from it. This runs the Windows build and tests on GitHub's runners
# instead (and libghostty-vt with MSVC), and never in ghostty-org/ghostty.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the saved Zig cache, like the ARM64 job: a build that failed
      # to fetch a dependency saved a cache that made every later build
      # fail to unpack it ("unable to unpack tarball ... ReadFailed").
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      # Zig's downloads sometimes fail on the runners ("unable to unpack
      # tarball ... ReadFailed", three runs in a row on windows-latest), so
      # fetch the dependencies first, retrying, before the build.
      - name: Fetch dependencies
        shell: pwsh
        run: |
          foreach ($i in 1..4) {
            zig build --fetch -Dtarget=x86_64-windows-gnu
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Fetching the dependencies failed (attempt $i), retrying."
            Start-Sleep -Seconds (15 * $i)
          }
          Write-Host "::error title=fetch::fetching the dependencies failed 4 times"
          exit 1

      # The app targets the GNU ABI (MinGW), as documented in WINDOWS.md;
      # the runner's native target would be MSVC. A failure's last lines
      # go in an annotation, which can be read without signing in.
      - name: Build
        shell: pwsh
        run: |
          zig build -Dtarget=x86_64-windows-gnu 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log | Where-Object { $_.Trim() } | Select-Object -Last 15) -join ' | '
            Write-Host "::error title=build::$tail"
            exit 1
          }

      # Failures are repeated as an annotation, which needs no sign-in.
      - name: Test
        shell: pwsh
        run: ./test/windows/unit-tests.ps1 -Target x86_64-windows-gnu

      # CLI actions through the ghostty.com launcher, which waits for them
      # and returns their exit code.
      - name: Test CLI actions
        shell: pwsh
        run: |
          $version = ./zig-out/bin/ghostty.com +version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'Ghostty') { throw "+version failed: $version" }
          Set-Content valid.conf 'font-size = 13'
          ./zig-out/bin/ghostty.com +validate-config --config-file=valid.conf
          if ($LASTEXITCODE -ne 0) { throw "+validate-config failed for a valid config" }
          Set-Content invalid.conf 'font-sise = 13'
          $out = ./zig-out/bin/ghostty.com +validate-config --config-file=invalid.conf | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'unknown field') { throw "+validate-config didn't report: $out" }
          $global:LASTEXITCODE = 0

      - name: Test PowerShell integration (5.1)
        shell: powershell
        run: ./test/windows/powershell-integration.ps1

      - name: Test PowerShell integration (7)
        shell: pwsh
        run: ./test/windows/powershell-integration.ps1

      # Start the app with each shell on the runner's desktop (with the
      # WARP software renderer), wait for the prompt, and check that the
      # pwd follows a cd.
      - name: Smoke test (PowerShell 7)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "pwsh.exe -NoLogo -NoProfile" -Prompt "PS "

      - name: Smoke test (Windows PowerShell)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "powershell.exe -NoLogo -NoProfile" -Prompt "PS "

      - name: Smoke test (cmd)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "cmd.exe" -Prompt ">" -Cd "cd /d"

      # Real keyboard and mouse input, which needs the foreground: typing,
      # Ctrl+V, and focus-follows-mouse between splits.
      - name: Desktop input test
        timeout-minutes: 10
        shell: pwsh
        run: ./test/windows/desktop-input.ps1 -Exe zig-out/bin/ghostty.exe

      # The unsafe paste dialog: Cancel, and the shell exiting while it's
      # open.
      - name: Unsafe paste dialog test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/paste-race.ps1 -Exe zig-out/bin/ghostty.exe

      # "Close terminal?" and "Change Terminal Title" from keybindings:
      # OK closes, and the shell exiting while one is open doesn't crash.
      # A console session handed to a running Ghostty through its terminal
      # handoff class (as when it's the default terminal application).
      - name: Console handoff test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/handoff.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Keybinding dialogs test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/dialog-race.ps1 -Exe zig-out/bin/ghostty.exe

      # Ctrl+clicking hyperlinks from terminal output: a text file opens,
      # a script is blocked, and another app's scheme asks first.
      - name: Links test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/links.ps1 -Exe zig-out/bin/ghostty.exe

      # The bell flashes the taskbar button only from the background, and
      # only with bell-features=attention (seen through a shell hook).
      - name: Bell flash test
        timeout-minutes: 5
        shell: powershell
        run: ./test/windows/bell-flash.ps1 -Exe zig-out/bin/ghostty.exe

      # A real OLE drag of a file onto a terminal (Windows PowerShell's
      # thread is STA, as drag and drop needs).
      - name: Drag and drop test
        shell: powershell
        run: ./test/windows/drag-drop.ps1 -Exe zig-out/bin/ghostty.exe

      # Dropping a file named `drop $(Write-Output RAN).txt` on PowerShell
      # pastes its path in single quotes, where `$(...)` doesn't run.
      - name: Drag and drop test (PowerShell)
        shell: powershell
        run: ./test/windows/drag-drop.ps1 -Exe zig-out/bin/ghostty.exe -PowerShell

      # The same with PowerShell started from cmd: the quoting follows the
      # shell that's running, not the one Ghostty started.
      - name: Drag and drop test (PowerShell under cmd)
        shell: powershell
        run: ./test/windows/drag-drop.ps1 -Exe zig-out/bin/ghostty.exe -PowerShell -Nested

      # A one-finger touch pan (injected with InjectTouchInput) scrolls.
      - name: Touch scroll test
        shell: pwsh
        run: ./test/windows/touch-scroll.ps1 -Exe zig-out/bin/ghostty.exe

      # The mouse wheel follows the "lines to scroll at a time" setting.
      - name: Wheel lines test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/wheel-lines.ps1 -Exe zig-out/bin/ghostty.exe

      # The cursor blinks at Windows' rate, and not when that's off.
      - name: Cursor blink test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/cursor-blink.ps1 -Exe zig-out/bin/ghostty.exe

      # The tab bar uses a high contrast theme's colors.
      - name: High contrast test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/high-contrast.ps1 -Exe zig-out/bin/ghostty.exe

      # A debug build acts as if its Direct3D device was removed, as after
      # a graphics driver update, and the terminal must draw again.
      - name: Device lost test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/device-lost.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Overlays test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/overlays.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Window theme test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/window-theme.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Session restore test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/session-restore.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Search test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/search.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Command palette test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/command-palette.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Tabs test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/tabs.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Window options test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/window-options.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Title prompt test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/title-prompt.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Title bar tabs test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/titlebar-tabs.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Tab reorder test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/tab-reorder.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Compact tabs test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/compact-tabs.ps1 -Exe zig-out/bin/ghostty.exe

      # OSC 10/11 color queries: the inbox ConPTY swallows them (a notice,
      # not a failure); with the ConPTY package's conpty.dll next to
      # ghostty.exe, Ghostty must answer. The package's files are removed
      # afterwards so the other tests keep using the inbox ConPTY.
      - name: Color query test
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/color-query.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Color query test (ConPTY package)
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./dist/windows/conpty.ps1 -Destination zig-out/bin
          try {
            ./test/windows/color-query.ps1 -Exe zig-out/bin/ghostty.exe
          } finally {
            Start-Sleep -Seconds 2
            Remove-Item zig-out/bin/conpty.dll, zig-out/bin/OpenConsole.exe -Force -ErrorAction SilentlyContinue
          }

      - name: Dark mode test
        shell: pwsh
        run: ./test/windows/dark-mode.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Tab tooltips test
        shell: pwsh
        run: ./test/windows/tab-tooltips.ps1 -Exe zig-out/bin/ghostty.exe

      # The UI Automation events screen readers listen for.
      - name: UI Automation events test
        shell: powershell
        run: ./test/windows/uia-events.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Quick terminal test
        shell: pwsh
        run: |
          ./test/windows/quick-terminal.ps1 -Exe zig-out/bin/ghostty.exe
          ./test/windows/quick-terminal.ps1 -Exe zig-out/bin/ghostty.exe -Remain

      - name: Translucent split and scrollbar test
        shell: pwsh
        run: |
          ./test/windows/translucent.ps1 -Exe zig-out/bin/ghostty.exe
          ./test/windows/translucent.ps1 -Exe zig-out/bin/ghostty.exe -Blur

      # Raises the display's scale while a terminal runs.
      - name: DPI change test
        shell: pwsh
        run: ./test/windows/dpi-change.ps1 -Exe zig-out/bin/ghostty.exe

      # Typing through the Japanese IME, which it installs first. Allowed to
      # fail while it's new, since it depends on the runner image having
      # the language capability.
      - name: IME test
        shell: powershell
        continue-on-error: true
        run: ./test/windows/ime.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Package
        shell: pwsh
        run: ./dist/windows/package.ps1 -OutDir zig-out/dist -Msix -BundleConpty

      # Install the unsigned MSIX on the runner (which is thrown away), and
      # run the app through its execution alias.
      - name: Install MSIX package
        shell: powershell
        run: |
          $msix = Get-ChildItem zig-out/dist/*.msix | Select-Object -First 1
          Add-AppxPackage -AllowUnsigned -Path $msix.FullName
          $pkg = Get-AppxPackage GhosttyWindowsUnofficial
          if (-not $pkg) { throw "the package isn't installed" }
          $pkg | Format-List Name, Version, Architecture, Status, InstallLocation
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\ghostty.exe"
          if (-not (Test-Path $alias)) { throw "no ghostty.exe execution alias" }
          $version = & $alias +version 2>&1 | Out-String
          $version
          if ($version -notmatch "Ghostty") { throw "+version didn't run" }
          $cli = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\ghostty-cli.exe"
          if (-not (Test-Path $cli)) { throw "no ghostty-cli.exe execution alias" }
          $version = & $cli +version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "Ghostty") { throw "ghostty-cli +version failed: $version" }
          ./test/windows/start-menu.ps1 -Msix
          ./test/windows/default-terminal.ps1
          Remove-AppxPackage $pkg.PackageFullName

      # Install the zip with its install.ps1, start it from its Start menu
      # shortcut, and uninstall it.
      - name: Install zip
        shell: powershell
        run: ./test/windows/start-menu.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      # The Scoop and winget manifests that releases attach, made from this
      # zip: winget validates them where it's installed.
      - name: Package manager manifests
        shell: pwsh
        run: |
          ./dist/windows/manifests.ps1 -Dist zig-out/dist -Version 0.0.1 `
            -BaseUrl https://example.invalid/releases/download/test `
            -Repository "$env:GITHUB_REPOSITORY" -OutDir zig-out/manifests
          $scoop = Get-Content -Raw zig-out/manifests/ghostty-windows-unofficial.json | ConvertFrom-Json
          if (-not $scoop.architecture.'64bit'.hash) { throw "the Scoop manifest has no x64 hash" }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest zig-out/manifests/winget
            if ($LASTEXITCODE -ne 0) { throw "winget validate failed with $LASTEXITCODE" }
          } else {
            Write-Host "::notice title=manifests::winget isn't installed on this runner, so the winget manifest wasn't validated"
          }

      # The package bundles the ConPTY package's conpty.dll, so programs'
      # OSC 10/11 color queries reach Ghostty and get its colors.
      - name: Color query test (package)
        timeout-minutes: 5
        shell: pwsh
        run: ./test/windows/color-query.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      # The window keeps responding while output floods in, on the
      # package's release build (the debug build was too slow to show it).
      - name: Flood test
        timeout-minutes: 10
        shell: powershell
        run: ./test/windows/flood.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      # Output alone makes Ghostty draw, not just the next cursor blink.
      - name: Output frames test
        timeout-minutes: 5
        shell: powershell
        run: ./test/windows/output-frames.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      # A minimized window keeps its terminal's size and doesn't draw.
      - name: Minimize test
        timeout-minutes: 5
        shell: powershell
        run: ./test/windows/minimize.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      - name: Mouse capture test
        timeout-minutes: 5
        shell: powershell
        run: ./test/windows/mouse-capture.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      - name: Context menu test
        timeout-minutes: 5
        shell: powershell
        run: ./test/windows/context-menu.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-windows-unofficial
          path: |
            zig-out/dist/*.zip
            zig-out/dist/*.msix
          retention-days: 14

  # The app on Windows Server 2022 (build 20348), from before Windows 11's
  # system backdrops: background blur takes the Windows 10 path there.
  build-windows-2022:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the saved Zig cache, like the ARM64 job: a build that failed
      # to fetch a dependency saved a cache that made every later build
      # fail to unpack it ("unable to unpack tarball ... ReadFailed").
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      # Zig's downloads sometimes fail on the runners ("unable to unpack
      # tarball ... ReadFailed", three runs in a row on windows-latest), so
      # fetch the dependencies first, retrying, before the build.
      - name: Fetch dependencies
        shell: pwsh
        run: |
          foreach ($i in 1..4) {
            zig build --fetch -Dtarget=x86_64-windows-gnu
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Fetching the dependencies failed (attempt $i), retrying."
            Start-Sleep -Seconds (15 * $i)
          }
          Write-Host "::error title=fetch::fetching the dependencies failed 4 times"
          exit 1

      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Smoke test with background blur
        shell: pwsh
        run: >
          ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "cmd.exe" -Prompt ">" -Cd "cd /d"
          -Extra "--background-opacity=0.8","--background-blur=true"
          -ExpectLog "background blur=true with the blur behind accent build=\d+ ok=true"

  # The app on ARM64 hardware.
  build-windows-arm64:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the saved Zig cache: after a build that failed to fetch a
      # dependency, the cache it saved made every later build fail while
      # configuring ("configuration failed: FileNotFound").
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      # Zig's downloads sometimes fail on the runners ("unable to unpack
      # tarball ... ReadFailed", three runs in a row on windows-latest), so
      # fetch the dependencies first, retrying, before the build.
      - name: Fetch dependencies
        shell: pwsh
        run: |
          foreach ($i in 1..4) {
            zig build --fetch -Dtarget=aarch64-windows-gnu
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Fetching the dependencies failed (attempt $i), retrying."
            Start-Sleep -Seconds (15 * $i)
          }
          Write-Host "::error title=fetch::fetching the dependencies failed 4 times"
          exit 1

      # On failure, put the end of the output on the run's page, since the
      # job log needs signing in.
      - name: Build
        shell: pwsh
        run: |
          zig version
          git --version
          zig build -Dtarget=aarch64-windows-gnu 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 6) -join ' / '
            Write-Host "::error title=arm64 build::$tail"
            exit 1
          }

      # Failures are repeated as an annotation, which needs no sign-in.
      - name: Test
        shell: pwsh
        run: ./test/windows/unit-tests.ps1 -Target aarch64-windows-gnu

      # The app in a real window on an ARM64 desktop.
      - name: Smoke test (cmd)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "cmd.exe" -Prompt ">" -Cd "cd /d"

      - name: Package
        shell: pwsh
        run: |
          try {
            ./dist/windows/package.ps1 -Target aarch64-windows-gnu -OutDir zig-out/dist -Msix -BundleConpty *>&1 | Tee-Object -FilePath package.log
          } catch {
            $tail = (Get-Content package.log -Tail 8) -join ' / '
            Write-Host "::error title=arm64 package::$($_.Exception.Message) / $tail"
            throw
          }

      # Installed on the runner, which is thrown away after the job.
      - name: Install MSIX package
        shell: pwsh
        run: |
          $msix = Get-ChildItem zig-out/dist/*.msix | Select-Object -First 1
          Add-AppxPackage -AllowUnsigned $msix.FullName
          $package = Get-AppxPackage GhosttyWindowsUnofficial
          Write-Host "Installed $($package.PackageFullName)"
          if ($package.Architecture -ne 'Arm64') { throw "the package is for $($package.Architecture), not Arm64" }
          ghostty-cli.exe +version
          if ($LASTEXITCODE -ne 0) { throw "ghostty-cli +version failed" }
          Remove-AppxPackage $package.PackageFullName

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-windows-unofficial-arm64
          path: |
            zig-out/dist/*.zip
            zig-out/dist/*.msix
          retention-days: 14

  # libghostty-vt with the runner's native target, which is MSVC: GitHub's
  # Windows runners have Visual Studio and the Windows SDK.
  build-libghostty-vt-windows:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Test libghostty-vt
        run: zig build test-lib-vt

      - name: Build libghostty-vt
        run: zig build -Demit-lib-vt

      - name: Test static linking
        working-directory: example/c-vt-static
        run: zig build

      # Run the example directly rather than through `zig build run`, so
      # the DLL is loaded the way an embedder would load it.
      - name: Build dynamic linking example
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          zig build
          # setup-zig moves the local cache out of the project directory.
          $cache = if ($env:ZIG_LOCAL_CACHE_DIR) { $env:ZIG_LOCAL_CACHE_DIR } else { ".zig-cache" }
          Get-ChildItem $cache -Recurse -Filter ghostty-vt.dll |
            Sort-Object LastWriteTime |
            Select-Object -Last 1 |
            Copy-Item -Destination zig-out/bin

      # pwsh reports the full NTSTATUS; `zig build run` and Git Bash
      # truncate it to 8 bits.
      - name: Test dynamic linking
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          ./zig-out/bin/c_vt_effects.exe
          $code = $LASTEXITCODE
          "exit code: 0x{0:X8}" -f $code
          exit $code

  # Once every job passed for a push to the windows branch, the packages
  # those jobs built and tested (ReleaseSafe zip and unsigned MSIX, x64 and
  # ARM64) replace the rolling windows-tip prerelease, like upstream's tip
  # release. Other branches, such as windows-rebased, don't publish.
  tip:
    if: github.repository != 'ghostty-org/ghostty' && github.event_name == 'push' && github.ref == 'refs/heads/windows'
    needs: [build-windows, build-windows-2022, build-windows-arm64, build-libghostty-vt-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ghostty-windows-unofficial*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          ls *.zip *.msix >/dev/null
          sha256sum *.zip *.msix > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Delete the previous tip release and its tag, then make the new one
      # at this commit. The tag moves with each tip.
      - name: Publish windows-tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-tip --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create windows-tip dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ghostty for Windows (unofficial) tip" \
            --notes "The latest commit of the windows branch that passed every Windows job: $GITHUB_SHA ($(date -u +%Y-%m-%d)). Unofficial and unsigned: install the zip with its install.ps1, or the MSIX with Add-AppxPackage -AllowUnsigned. See WINDOWS.md. Replaced on every passing push."
