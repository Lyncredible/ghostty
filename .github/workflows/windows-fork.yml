on:
  push:
    branches: [windows]
  workflow_dispatch: {}

name: Windows (fork)

# The Test workflow's jobs run on Namespace runners, which only
# ghostty-org/ghostty has, so forks working on the Windows port get no CI
# from it. This runs the Windows build and tests on GitHub's runners
# instead (and libghostty-vt with MSVC), and never in ghostty-org/ghostty.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      # The app targets the GNU ABI (MinGW), as documented in WINDOWS.md;
      # the runner's native target would be MSVC.
      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Test
        run: zig build test -Dtarget=x86_64-windows-gnu --summary all

      # CLI actions through the ghostty.com launcher, which waits for them
      # and returns their exit code.
      - name: Test CLI actions
        shell: pwsh
        run: |
          $version = ./zig-out/bin/ghostty.com +version | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'Ghostty') { throw "+version failed: $version" }
          Set-Content valid.conf 'font-size = 13'
          ./zig-out/bin/ghostty.com +validate-config --config-file=valid.conf
          if ($LASTEXITCODE -ne 0) { throw "+validate-config failed for a valid config" }
          Set-Content invalid.conf 'font-sise = 13'
          $out = ./zig-out/bin/ghostty.com +validate-config --config-file=invalid.conf | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'unknown field') { throw "+validate-config didn't report: $out" }
          $global:LASTEXITCODE = 0

      - name: Test PowerShell integration (5.1)
        shell: powershell
        run: ./test/windows/powershell-integration.ps1

      - name: Test PowerShell integration (7)
        shell: pwsh
        run: ./test/windows/powershell-integration.ps1

      # Start the app with each shell on the runner's desktop (with the
      # WARP software renderer), wait for the prompt, and check that the
      # pwd follows a cd.
      - name: Smoke test (PowerShell 7)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "pwsh.exe -NoLogo -NoProfile" -Prompt "PS "

      - name: Smoke test (Windows PowerShell)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "powershell.exe -NoLogo -NoProfile" -Prompt "PS "

      - name: Smoke test (cmd)
        shell: pwsh
        run: ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "cmd.exe" -Prompt ">" -Cd "cd /d"

      # Real keyboard and mouse input, which needs the foreground: typing,
      # Ctrl+V, and focus-follows-mouse between splits.
      - name: Desktop input test
        shell: pwsh
        run: ./test/windows/desktop-input.ps1 -Exe zig-out/bin/ghostty.exe

      # A real OLE drag of a file onto a terminal (Windows PowerShell's
      # thread is STA, as drag and drop needs).
      - name: Drag and drop test
        shell: powershell
        run: ./test/windows/drag-drop.ps1 -Exe zig-out/bin/ghostty.exe

      # A one-finger touch pan (injected with InjectTouchInput) scrolls.
      - name: Touch scroll test
        shell: pwsh
        run: ./test/windows/touch-scroll.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Dark mode test
        shell: pwsh
        run: ./test/windows/dark-mode.ps1 -Exe zig-out/bin/ghostty.exe

      # Typing through the Japanese IME, which it installs first. Allowed to
      # fail while it's new, since it depends on the runner image having
      # the language capability.
      - name: IME test
        shell: powershell
        continue-on-error: true
        run: ./test/windows/ime.ps1 -Exe zig-out/bin/ghostty.exe

      - name: Package
        shell: pwsh
        run: ./dist/windows/package.ps1 -OutDir zig-out/dist -Msix

      # Install the unsigned MSIX on the runner (which is thrown away), and
      # run the app through its execution alias.
      - name: Install MSIX package
        shell: powershell
        run: |
          $msix = Get-ChildItem zig-out/dist/*.msix | Select-Object -First 1
          Add-AppxPackage -AllowUnsigned -Path $msix.FullName
          $pkg = Get-AppxPackage GhosttyWindowsUnofficial
          if (-not $pkg) { throw "the package isn't installed" }
          $pkg | Format-List Name, Version, Architecture, Status, InstallLocation
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\ghostty.exe"
          if (-not (Test-Path $alias)) { throw "no ghostty.exe execution alias" }
          $version = & $alias +version 2>&1 | Out-String
          $version
          if ($version -notmatch "Ghostty") { throw "+version didn't run" }
          $cli = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\ghostty-cli.exe"
          if (-not (Test-Path $cli)) { throw "no ghostty-cli.exe execution alias" }
          $version = & $cli +version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "Ghostty") { throw "ghostty-cli +version failed: $version" }
          ./test/windows/start-menu.ps1 -Msix
          Remove-AppxPackage $pkg.PackageFullName

      # Install the zip with its install.ps1, start it from its Start menu
      # shortcut, and uninstall it.
      - name: Install zip
        shell: powershell
        run: ./test/windows/start-menu.ps1 -Zip (Get-ChildItem zig-out/dist/*.zip | Select-Object -First 1).FullName

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-windows-unofficial
          path: |
            zig-out/dist/*.zip
            zig-out/dist/*.msix
          retention-days: 14

  # The app on Windows Server 2022 (build 20348), from before Windows 11's
  # system backdrops: background blur takes the Windows 10 path there.
  build-windows-2022:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Build
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Smoke test with background blur
        shell: pwsh
        run: >
          ./test/windows/smoke.ps1 -Exe zig-out/bin/ghostty.exe -Command "cmd.exe" -Prompt ">" -Cd "cd /d"
          -Extra "--background-opacity=0.8","--background-blur=true"
          -ExpectLog "background blur=true with the blur behind accent build=\d+ ok=true"

  # The app on ARM64 hardware.
  build-windows-arm64:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without the saved Zig cache: after a build that failed to fetch a
      # dependency, the cache it saved made every later build fail while
      # configuring ("configuration failed: FileNotFound").
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      # On failure, put the end of the output on the run's page, since the
      # job log needs signing in.
      - name: Build
        shell: pwsh
        run: |
          zig version
          git --version
          zig build -Dtarget=aarch64-windows-gnu 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 6) -join ' / '
            Write-Host "::error title=arm64 build::$tail"
            exit 1
          }

      - name: Test
        run: zig build test -Dtarget=aarch64-windows-gnu --summary all

  # libghostty-vt with the runner's native target, which is MSVC: GitHub's
  # Windows runners have Visual Studio and the Windows SDK.
  build-libghostty-vt-windows:
    if: github.repository != 'ghostty-org/ghostty'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Test libghostty-vt
        run: zig build test-lib-vt

      - name: Build libghostty-vt
        run: zig build -Demit-lib-vt

      - name: Test static linking
        working-directory: example/c-vt-static
        run: zig build

      # Run the example directly rather than through `zig build run`, so
      # the DLL is loaded the way an embedder would load it.
      - name: Build dynamic linking example
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          zig build
          # setup-zig moves the local cache out of the project directory.
          $cache = if ($env:ZIG_LOCAL_CACHE_DIR) { $env:ZIG_LOCAL_CACHE_DIR } else { ".zig-cache" }
          Get-ChildItem $cache -Recurse -Filter ghostty-vt.dll |
            Sort-Object LastWriteTime |
            Select-Object -Last 1 |
            Copy-Item -Destination zig-out/bin

      # pwsh reports the full NTSTATUS; `zig build run` and Git Bash
      # truncate it to 8 bits.
      - name: Test dynamic linking
        working-directory: example/c-vt-effects
        shell: pwsh
        run: |
          ./zig-out/bin/c_vt_effects.exe
          $code = $LASTEXITCODE
          "exit code: 0x{0:X8}" -f $code
          exit $code
