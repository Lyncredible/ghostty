on:
  # A tag like windows-unofficial-2026.11.01 makes a draft release for it.
  push:
    tags: ["windows-unofficial-*"]
  # Starting it by hand needs this file on the default branch.
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also attach the packages to a new draft release"
        type: boolean
        default: false

name: Windows release (fork)

# Builds the unofficial Windows packages (portable zip and unsigned MSIX)
# for x64 and ARM64 in ReleaseSafe, with SHA-256 checksums, and keeps them
# as a 90 day artifact. For a tag, or with draft_release, it also creates a
# draft release with them, which stays private until someone publishes it.
# It only runs for those tags or when started by hand, and never in
# ghostty-org/ghostty.

permissions:
  contents: read

jobs:
  package:
    if: github.repository != 'ghostty-org/ghostty'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-windows-gnu
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-windows-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # The full history: package.ps1 names the package with `git describe`
      # and numbers the MSIX version by commit count.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false

      - name: Package
        shell: pwsh
        run: ./dist/windows/package.ps1 -Target ${{ matrix.target }} -OutDir zig-out/dist -Msix -BundleConpty

      # The packaged app must start and print its version.
      - name: Check the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem zig-out/dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no zip was made" }
          if (-not (Get-ChildItem zig-out/dist -Filter *.msix)) { throw "no MSIX was made" }
          Expand-Archive $zip.FullName -DestinationPath check
          $cli = Get-ChildItem check -Recurse -Filter ghostty.com | Select-Object -First 1
          & $cli.FullName +version
          if ($LASTEXITCODE -ne 0) { throw "+version failed with $LASTEXITCODE" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem zig-out/dist -File | Where-Object { $_.Extension -in '.zip', '.msix' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii zig-out/dist/SHA256SUMS-${{ matrix.arch }}.txt
          Get-Content zig-out/dist/SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghostty-windows-unofficial-release-${{ matrix.arch }}
          retention-days: 90
          path: |
            zig-out/dist/*.zip
            zig-out/dist/*.msix
            zig-out/dist/SHA256SUMS-*.txt

  draft-release:
    if: github.repository != 'ghostty-org/ghostty' && (inputs.draft_release || github.ref_type == 'tag')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ghostty-windows-unofficial-release-*
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="$GITHUB_REF_NAME"
          else
            name="windows-unofficial-$(date -u +%Y%m%d)-${GITHUB_SHA::9}"
          fi
          gh release create "$name" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Ghostty for Windows (unofficial) $name" \
            --notes "Unofficial Windows build of $GITHUB_SHA ($GITHUB_REF_NAME). The MSIX is unsigned: install it with Add-AppxPackage -AllowUnsigned. See WINDOWS.md."
